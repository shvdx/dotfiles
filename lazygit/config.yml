git:
  diffRenderers:
    # {{colorScheme}} => terminal bg (rex answers OSC 11); {{width}} => bg fill stops at view edge
    # bgs: vesper.nvim palette{,_light}.lua added/deleted blended 15% toward bg
    - colorArg: always
      command: >-
        delta --paging=never --{{colorScheme}} --line-numbers --syntax-theme=ansi --width={{width}}
        {{if eq .colorScheme "light"}}--plus-style='syntax "#d8e9e4"' --minus-style='syntax "#f3dfdf"'{{else}}--plus-style='syntax "#253430"' --minus-style='syntax "#342121"'{{end}}
