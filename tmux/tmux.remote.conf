# Remote (ssh server) variant of tmux.conf; lives at ~/.tmux.conf on the server
# no macOS deps, no -n bindings (local tmux eats them when nested)
# -q on version-dependent options => older server tmux skips instead of erroring

# Terminal settings
set -sq extended-keys on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set-option -gq xterm-keys on
set -gaq terminal-features 'xterm*:extkeys'
set -gq allow-passthrough on

# Prefix: C-b; local tmux owns C-a
set -g prefix C-b
bind C-b send-prefix

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# No escape delay
set -sg escape-time 0

# Mouse support
set -g mouse on

set -g set-clipboard on

# Vi mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi _ send-keys -X start-of-line
bind-key -T copy-mode-vi $ send-keys -X end-of-line
unbind -T copy-mode-vi MouseDragEnd1Pane

# History
set -g history-limit 50000

# Renumber windows
set -g renumber-windows on

# Splits in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize with prefix; repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick actions
bind x kill-pane
bind X kill-window
bind z resize-pane -Z

VESPER_ORANGE="#E4A475"
VESPER_GREEN="#66DDCC"
VESPER_BLUE="#7EA1EA"
VESPER_PURPLE="#C7A9FF"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Bells: message only, no sound
set -g visual-activity off
set -g visual-bell off
set -g activity-action other

set -g bell-action other
set -wg monitor-bell on
set -g monitor-activity off
setw -g window-status-bell-style "fg=#121212,bold,underscore"   # rung tab -> underlined

set-hook -g alert-bell {
    if -F "#{!:#{window_active}}" {
        display-message -d 0 "bell  #{window_index}:#{window_name}  (#{pane_current_command})"
    }
}

# Status bar: bottom; local tmux bar sits on top when nested
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=${VESPER_PURPLE},fg=#121212"   # full purple => remote
set -g status-interval 1

# Status left: session name; inverted
set -g status-left "#[bg=#121212,fg=${VESPER_PURPLE},bold] #S "
set -g status-left-length 20

# Status right: host, time
set -g status-right "#[bg=terminal,fg=${VESPER_PURPLE},bold] #H, %a %d, %-I:%M %p "
set -g status-right-length 50

# Window status format
set -g window-status-style "fg=#121212"
setw -g window-status-format " #I #W:#{pane_current_command} "
setw -g window-status-current-format "#[bg=#121212,fg=${VESPER_PURPLE},bold] #I #W:#{pane_current_command} "
setw -g window-status-activity-style "fg=#121212,underscore"
setw -g window-status-separator ""

# Pane borders
set -gq pane-border-lines single
set -g pane-border-style "fg=#282828"
set -g pane-active-border-style "fg=${VESPER_ORANGE}"

# Message style
set -g message-style "bg=${VESPER_BLUE} fg=#121212 bold"
set -g message-command-style "bg=${VESPER_ORANGE} fg=#121212 bold"

# Mode style (copy mode)
setw -g mode-style "bg=${VESPER_ORANGE} fg=#000000"

# Clock
setw -g clock-mode-colour "${VESPER_BLUE}"

# Plugins; no tmux-dark-notify (macOS only)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tpm missing => clone + install plugins on first start
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
